<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Echoes of Genesis - Astraea Online (2.5D Isometric Dark Fantasy ARPG)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Cinzel:wght@700;800&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070c;
      font-family: 'Spectral', Georgia, serif;
      color: #e2e8f0;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      background: #05070c url('/assets/bg/loading/loading_bg.png') no-repeat center center / cover;
    }

    /* Screen Edge Subtle Vignette */
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.2);
    }

    /* TOP-LEFT: Dual Ornate HP & MP Bars (Flare / Diablo Style) */
    .gothic-player-frame {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(10, 13, 20, 0.88);
      backdrop-filter: blur(6px);
      padding: 8px 12px;
      border: 2px solid #927038;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), inset 0 0 8px rgba(0, 0, 0, 0.8);
    }
    .player-name-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .player-name-label {
      font-family: 'Spectral', Georgia, serif;
      font-size: 16px;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
    }
    .player-level-badge {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      background: #1e293b;
      padding: 1px 6px;
      border-radius: 3px;
      border: 1px solid #475569;
    }
    /* HP Bar */
    .resource-bar-wrap {
      width: 190px;
      height: 14px;
      background: #180909;
      border: 1px solid #450a0a;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    .resource-bar-fill.hp {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #991b1b, #ef4444);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: width 0.2s ease;
    }
    /* MP Bar */
    .resource-bar-fill.mp {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #075985, #0ea5e9);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: width 0.2s ease;
    }
    .resource-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Chakra Petch', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
      text-shadow: 0 1px 2px #000;
    }

    /* TOP-CENTER: Monster Target Health Bar (Flare Lochport Cemetery Style) */
    .target-monster-frame {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: rgba(10, 13, 20, 0.9);
      backdrop-filter: blur(6px);
      padding: 6px 16px;
      border: 2px solid #854d0e;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      transition: opacity 0.2s ease;
    }
    .target-name {
      font-family: 'Spectral', Georgia, serif;
      font-size: 16px;
      font-weight: 700;
      color: #fca5a5;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
    }
    .target-bar-wrap {
      width: 170px;
      height: 10px;
      background: #1f1212;
      border: 1px solid #7f1d1d;
      position: relative;
      border-radius: 2px;
      overflow: hidden;
    }
    .target-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #881337, #e11d48);
      transition: width 0.15s ease;
    }

    /* TOP-RIGHT: Minimap Radar Frame (Lochport Cemetery) */
    .minimap-frame {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      pointer-events: none;
      background: rgba(10, 13, 20, 0.9);
      backdrop-filter: blur(6px);
      border: 2px solid #927038;
      border-radius: 4px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }
    .map-title {
      font-family: 'Spectral', Georgia, serif;
      font-size: 15px;
      font-weight: 700;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.5px;
    }
    .radar-canvas {
      width: 80px;
      height: 80px;
      background: #0f1520;
      border: 1px solid #334155;
      border-radius: 40px;
      position: relative;
      overflow: hidden;
    }
    .radar-ping-info {
      display: flex;
      gap: 8px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
    }
    .radar-ping-info span {
      color: #38bdf8;
    }

    /* BOTTOM-CENTER: Ornate Gothic Action Bar (Hotbar) */
    .gothic-action-dock {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(10, 13, 20, 0.92);
      backdrop-filter: blur(8px);
      border: 2px solid #927038;
      border-radius: 6px;
      padding: 6px 12px;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.9);
    }
    .action-slot {
      width: 44px;
      height: 44px;
      background: #0f172a;
      border: 1.5px solid #64748b;
      border-radius: 4px;
      position: relative;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.1s ease;
    }
    .action-slot:hover {
      border-color: #fbbf24;
      transform: translateY(-2px);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    .action-slot:active {
      transform: translateY(1px);
    }
    .slot-key-badge {
      position: absolute;
      top: 1px;
      left: 3px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #fbbf24;
      text-shadow: 0 1px 3px #000;
    }
    .slot-icon-img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    /* Bottom-Right Chat Overlay */
    .hud-bottom-right {
      position: absolute;
      bottom: 12px;
      right: 14px;
      z-index: 10;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: min(300px, 85vw);
    }
    .chat-logs {
      max-height: 85px;
      overflow-y: auto;
      background: rgba(10, 13, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .chat-msg .sender {
      color: #38bdf8;
      font-weight: 600;
    }
    .chat-msg.system {
      color: #fbbf24;
      font-style: italic;
    }
    .chat-input-row {
      display: flex;
      gap: 4px;
    }
    .chat-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 5px 8px;
      color: #fff;
      font-size: 11px;
      outline: none;
    }
    .chat-input:focus {
      border-color: #fbbf24;
    }
    .chat-send-btn {
      background: #854d0e;
      color: #fff;
      border: 1px solid #d97706;
      border-radius: 4px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Gameplay HUD Container & Hidden State for Loading */
    #gameplay-hud {
      transition: opacity 0.5s ease-in-out;
    }
    #gameplay-hud.hud-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div class="vignette-overlay"></div>

  <!-- CONTAINER CHỨA TOÀN BỘ HUD GAMEPLAY (Ẩn khi đang ở màn Loading / PreloadScene) -->
  <div id="gameplay-hud" class="hud-hidden">
  <!-- TOP-LEFT: Gothic Dual HP & MP Bars -->
  <div class="gothic-player-frame">
    <div class="player-name-row">
      <span class="player-name-label" id="hud-player-name">Hiệp Sĩ Khởi Nguyên</span>
      <span class="player-level-badge">Lv. 1</span>
    </div>
    <!-- HP Bar -->
    <div class="resource-bar-wrap">
      <div class="resource-bar-fill hp" id="hud-hp-bar" style="width: 100%;"></div>
      <span class="resource-text" id="hud-hp-text">120 / 120</span>
    </div>
    <!-- MP Bar -->
    <div class="resource-bar-wrap">
      <div class="resource-bar-fill mp" id="hud-mp-bar" style="width: 100%;"></div>
      <span class="resource-text" id="hud-mp-text">80 / 80</span>
    </div>
  </div>

  <!-- TOP-CENTER: Monster Target Health Bar -->
  <div class="target-monster-frame" id="hud-target-frame">
    <span class="target-name" id="hud-target-name">💀 Zombie (Cấp 2)</span>
    <div class="target-bar-wrap">
      <div class="target-bar-fill" id="hud-target-bar" style="width: 100%;"></div>
    </div>
  </div>

  <!-- TOP-RIGHT: Minimap Radar -->
  <div class="minimap-frame">
    <div class="map-title">📍 Nghĩa Địa Lochport</div>
    <div class="radar-canvas" id="hud-radar">
      <div id="radar-player-dot" style="position: absolute; top: 38px; left: 38px; width: 6px; height: 6px; background: #38bdf8; border-radius: 3px; box-shadow: 0 0 6px #38bdf8;"></div>
      <div id="radar-monster-dot" style="position: absolute; top: 30px; left: 52px; width: 6px; height: 6px; background: #ef4444; border-radius: 3px;"></div>
    </div>
    <div class="radar-ping-info">
      <div>Ping: <span id="stat-ping">1 ms</span></div>
      <div>FPS: <span id="stat-fps">60</span></div>
      <div>Online: <span id="stat-online">1</span></div>
    </div>
  </div>

  <!-- BOTTOM-CENTER: Ornate Gothic Action Bar (Flare Style) -->
  <div class="gothic-action-dock">
    <div class="action-slot" id="slot-1" title="[Phím 1] Trảm Thần Kiếm">
      <span class="slot-key-badge">1</span>
      <span style="font-size: 20px;">⚔️</span>
    </div>
    <div class="action-slot" id="slot-2" title="[Phím 2] Cột Băng Ma Pháp (Ice Spikes)">
      <span class="slot-key-badge">2</span>
      <span style="font-size: 20px;">❄️</span>
    </div>
    <div class="action-slot" id="slot-3" title="[Phím 3] Hỏa Cầu (Fireball)">
      <span class="slot-key-badge">3</span>
      <span style="font-size: 20px;">🔥</span>
    </div>
    <div class="action-slot" id="slot-4" title="[Phím 4] Bình Máu Đỏ (+50 HP)">
      <span class="slot-key-badge">4</span>
      <span style="font-size: 20px;">🧪</span>
    </div>
    <div class="action-slot" id="slot-5" title="[Phím 5] Bình Mana Lam (+30 MP)">
      <span class="slot-key-badge">5</span>
      <span style="font-size: 20px;">💧</span>
    </div>
    <div class="action-slot" id="slot-6" title="[Phím Q] Cổ Thư Khởi Nguyên (Nova Blast)">
      <span class="slot-key-badge">Q</span>
      <span style="font-size: 20px;">📖</span>
    </div>
  </div>

  <!-- Bottom-Right Chat Overlay -->
  <div class="hud-bottom-right">
    <div class="chat-logs" id="chat-logs">
      <div class="chat-msg system">⚔️ Bước vào Nghĩa Địa Lochport - Vùng Đất Cổ Thư.</div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" class="chat-input" placeholder="Chat Enter..." maxlength="80" />
      <button id="chat-send" class="chat-send-btn">Gửi</button>
    </div>
  </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
